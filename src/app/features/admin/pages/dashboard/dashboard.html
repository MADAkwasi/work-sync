<app-header />
<main class="px-6 py-8 flex flex-col gap-8">
  <div>
    <h1 class="font-bold text-2xl md:text-3xl">Leave Requests</h1>
    <p class="font-light text-sm md:text-base">Manage and approve leave requests from your team</p>
  </div>

  <section class="flex flex-col gap-8">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 justify-between">
      <p-card subheader="Pending Approvals" class="!bg-white">
        <p class="text-[#222] text-2xl md:text-3xl font-bold">N/A</p>
      </p-card>
      <p-card subheader="Absences Today" class="!bg-white">
        <p class="text-[#222] text-2xl md:text-3xl font-bold">
          {{ countLeavesByPeriod('day') }}
        </p>
      </p-card>
      <p-card subheader="Absences This Week" class="!bg-white">
        <p class="text-[#222] text-2xl md:text-3xl font-bold">
          {{ countLeavesByPeriod('week') }}
        </p>
      </p-card>
      <p-card subheader="Total Leave Days This Month" class="!bg-white">
        <p class="text-[#222] text-2xl md:text-3xl font-bold">
          {{ countLeavesByPeriod('month') }}
        </p>
      </p-card>
    </div>

    <app-table [data]="pendingRequests()" variant="pending" />

    <app-table [data]="leaves()" variant="view-all" />
  </section>
</main>
