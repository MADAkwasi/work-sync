<app-header />
<main class="px-6 py-8 flex flex-col gap-8">
  <div>
    <h1 class="font-bold text-3xl">Leave Requests</h1>
    <p class="font-light">Manage and approve leave requests from your team</p>
  </div>

  <section class="flex flex-col gap-8">
    <div class="flex gap-4 justify-between">
      @for(card of cards; track $index){
      <p-card [subheader]="card.title" class="!bg-white !w-1/4 2xl:!w-1/5">
        <p
          class="text-3xl font-bold"
          [class]="card.title === 'Pending Approvals' ? 'text-yellow-500' : 'text-[#222]'"
        >
          {{ card.content }}
        </p>
      </p-card>
      }
    </div>

    <app-table [data]="pendingRequests()" variant="pending" />

    <app-table [data]="leaves" variant="view-all" />
  </section>
</main>
